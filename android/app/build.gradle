plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.umbranox.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.umbranox.mobile"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    sourceSets {
        main {
            assets.srcDir("../../frontend")
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install("Flask==3.1.0")
        }
    }
    sourceSets {
        main {
            srcDir("../../backend")
        }
    }
}
